<!DOCTYPE html>
<html>
<head>
    <title>Flash Market</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: white;
        }

        header {
            background: black;
            padding: 20px;
            text-align: center;
            font-size: 28px;
            letter-spacing: 2px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 20px;
        }

        .card {
            background: #1c1c1c;
            width: 350px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

        .info {
            padding: 25px;
            text-align: center;
        }

        .precio {
            font-size: 22px;
            color: #00ffcc;
            margin: 15px 0;
            font-weight: bold;
        }

        .btn {
            background: #00ffcc;
            color: black;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
        }

        .btn:hover {
            background: white;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>FLASH MARKET ⚡</header>

<div class="container">
    <div class="card">
        <img src="fc24.jpg" alt="FC24 PS5">
        <div class="info">
            <h2>EA Sports FC 24 - PS5</h2>
            <div class="precio">$45.00</div>
            <a class="btn" href="producto.html">
                Ver Producto
            </a>
        </div>
    </div>
</div>

<footer>
    WhatsApp: +507 6988-7359<br>
    Instagram: @flash_market.pty<br>
    © 2026 Flash Market Panamá
</footer>

</body>
</html>

<!DOCTYPE html>

    <style>
        body {

            background: #0f0f0f;
            color: white;
        }

        header {
            background: black;
            padding: 20px;
            text-align: center;
            font-size: 28px;
            letter-spacing: 2px;
        }

        .productos {
            display: flex;
            flex-wrap: wrap;

            padding: 40px 20px;
        }

        .producto {
            background: #1c1c1c;
            width: 280px;
            margin: 20px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            transition: 0.3s;
            text-align: center;
        }

        .producto:hover {
            transform: translateY(-8px);
        }

        .producto img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .info {
            padding: 20px;
        }

        .info h3 {
            margin: 10px 0;
            font-weight: bold;
        }

        .precio {
            font-size: 20px;
            margin: 10px 0;
            color: #00ffcc;
            font-weight: bold;
        }

        .btn {
            background: #00ffcc;
            color: black;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 15px;
        }

        .btn:hover {
            background: white;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #aaa;
            font-size: 14px;
        }

</head>

<!DOCTYPE html>
<html>
<head>
    <title>Flash market</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8f8f8;
            color: #333;
        }

        header {
            background-color: #111;
            color: white;
            padding: 25px;
            text-align: center;
            letter-spacing: 2px;
        }

        header h1 {
            margin: 0;
            font-weight: 300;
        }

        nav {
            background-color: white;
            text-align: center;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        nav a {
            margin: 0 20px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
        }

        nav a:hover {
            color: #000;
        }

        .banner {
            background: linear-gradient(to right, #111, #333);
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        .banner h2 {
            font-weight: 300;
            font-size: 32px;
        }

        .productos {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            padding: 40px 20px;
        }

        .producto {
            background: white;
            width: 280px;
            margin: 20px;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .producto:hover {
            transform: translateY(-8px);
        }

        .producto img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .info {
            padding: 20px;
            text-align: center;
        }

        .info h3 {
            margin: 10px 0;
            font-weight: 500;
        }

        .precio {
            font-size: 18px;
            margin: 10px 0;
            font-weight: bold;
        }

        button {
            background-color: #111;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #444;
        }

        footer {
            background-color: #111;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <h1>Flash market</h1>
</header>

<nav>
    <a href="#">Inicio</a>
    <a href="#">Productos</a>
    <a href="#">Contacto</a>
</nav>

<section class="banner">
    <h2>Productos exclusivos al mejor precio</h2>
    <p>Calidad • Estilo • Tecnología</p>
</section>

<section class="productos">

    <div class="producto">
        <img src="https://via.placeholder.com/300x250" alt="Audífonos">
        <div class="info">
            <h3>Audífonos Premium</h3>
            <p class="precio">$18.00</p>
            <button>Comprar</button>
        </div>
    </div>

    <div class="producto">
        <img src="https://via.placeholder.com/300x250" alt="Reloj">
        <div class="info">
            <h3>Smartwatch Elegante</h3>
            <p class="precio">$29.00</p>
            <button>Comprar</button>
        </div>
    </div>

    <div class="producto">
        <img src="https://via.placeholder.com/300x250" alt="Luz LED">
        <div class="info">
            <h3>Luz LED Moderna</h3>
            <p class="precio">$12.00</p>
            <button>Comprar</button>
        </div>
    </div>

</section>

<footer>
    <p>WhatsApp: +507 6000-0000</p>
    <p>Instagram: @flash_market.pty</p>
    <p>© 2026 Flash market Panamá</p>
</footer>

</body>
</html>
